<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6fa" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23080808'/%3E%3Cpath d='M5 23 15 6l4 8 8-5-7 17-5-7-10 4Z' fill='%23ffffff'/%3E%3C/svg%3E" />
    <title>MicroFlow</title>
    <script>
      try {
        const theme = localStorage.getItem('theme');
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
          ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
